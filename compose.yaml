services:
  nginx:
    container_name: secure-file-manager-nginx
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app

  app:
    image: ics0027-file-manager:local
    container_name: secure-file-manager-app
    build:
      context: .
      args:
        NEXT_PUBLIC_FILE_OPERATION_POLL_MS: ${NEXT_PUBLIC_FILE_OPERATION_POLL_MS:-2000}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://secure-file-manager.dev:8443}
      DATABASE_URL: postgresql://${POSTGRES_USER:-storage}:${POSTGRES_PASSWORD:-storage_dev_password}@db:5432/${POSTGRES_DB:-storage}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - encrypted_files:/app/storage

  worker:
    image: ics0027-file-manager:local
    build:
      context: .
      args:
        NEXT_PUBLIC_FILE_OPERATION_POLL_MS: ${NEXT_PUBLIC_FILE_OPERATION_POLL_MS:-2000}
    command: ["node", "dist/worker/worker.js"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-storage}:${POSTGRES_PASSWORD:-storage_dev_password}@db:5432/${POSTGRES_DB:-storage}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - encrypted_files:/app/storage

  db:
    container_name: secure-file-manager-db
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storage}
      POSTGRES_USER: ${POSTGRES_USER:-storage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storage_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  encrypted_files:
