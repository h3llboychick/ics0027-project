log_format sfm_json escape=json '{"timestamp":"$time_iso8601","event":"proxy.request","sourceAddress":"$remote_addr","method":"$request_method","status":$status}';

server {
    listen 443 ssl;
    server_name secure-file-manager.dev;
    # Request URLs can contain verification/reset tokens. Keep them out of logs.
    access_log /var/log/nginx/access.log sfm_json;
    error_log /var/log/nginx/error.log crit;

    ssl_certificate /etc/nginx/certs/server-ecdsa.crt;
    ssl_certificate_key /etc/nginx/certs/server-ecdsa.key;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        
        proxy_buffering off;

        client_max_body_size 26M;
    }
}
